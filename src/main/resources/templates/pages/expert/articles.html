<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bài viết của tôi</title>
    <style>
        body{background:#f8fafb}
        main{padding:24px;max-width:1400px;margin:0 auto}
        .page-title h1{font-size:28px;font-weight:700;color:#2e7d32;margin-bottom:8px}
        .page-title p{font-size:14px;color:#6b7280;margin-top:4px}
        .toolbar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;margin-bottom:20px}
        .btn-new{background:linear-gradient(135deg,#66bb6a 0%,#4caf50 100%);color:#fff;padding:12px 20px;border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;box-shadow:0 4px 12px rgba(76,175,80,0.3);transition:all 0.3s}
        .btn-new:hover{background:linear-gradient(135deg,#4caf50 0%,#388e3c 100%);transform:translateY(-2px);box-shadow:0 6px 16px rgba(76,175,80,0.4)}
        .card{background:#fff;border:2px solid #e8f5e9;border-radius:20px;padding:24px;box-shadow:0 4px 16px rgba(76,175,80,0.08)}
        table{width:100%;border-collapse:separate;border-spacing:0}
        th,td{padding:16px;text-align:left;font-size:14px}
        th{font-size:13px;text-transform:uppercase;color:#ffffff;font-weight:700;background:#2e7d32;border-bottom:none}
        th:first-child{border-top-left-radius:12px}
        th:last-child{border-top-right-radius:12px}
        td{border-bottom:1px solid #e8f5e9;color:#424242}
        tr:hover td{background:#f1f8e9}
        .actions a{margin-right:12px;text-decoration:none;color:#2e7d32;font-weight:700;padding:8px 14px;background:#e8f5e9;border-radius:10px;border:2px solid #c8e6c9;transition:all 0.2s;display:inline-block}
        .actions a:hover{background:#c8e6c9;transform:translateY(-2px);box-shadow:0 4px 12px rgba(76,175,80,0.2)}
        .status-badge{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:700;text-transform:uppercase;display:inline-block;border:2px solid}
        .status-published{background:#c8e6c9;color:#1b5e20;border-color:#66bb6a}
        .status-rejected{background:#ffcdd2;color:#c62828;border-color:#ef5350}
        .status-draft{background:#f3f4f6;color:#4b5563;border-color:#d1d5db}
        .status-pending{background:#fff9c4;color:#f57f17;border-color:#fdd835}
    </style>
</head>
<body>
<div th:replace="~{fragments/expert-layout :: expertLayout('Bài viết của tôi', 'articles', ~{::main})}">
    <main>
        <div class="page-title">
            <h1>Bài viết của tôi</h1>
            <p>Quản lý, cập nhật và gửi duyệt bài viết.</p>
        </div>
        <div class="toolbar">
            <div></div>
            <a class="btn-new" th:href="@{/expert/articles/new}">+ Viết bài mới</a>
        </div>
        <div class="card">
            <table>
                <thead><tr><th>Tiêu đề</th><th>Trạng thái</th><th>Cập nhật</th><th>Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="a : ${articles.content}">
                    <td th:text="${a.title}">Tiêu đề</td>
                    <td>
                        <span th:class="${'status-badge ' + (a.status.name() == 'PUBLISHED' ? 'status-published' : (a.status.name() == 'REJECTED' ? 'status-rejected' : (a.status.name() == 'PENDING' ? 'status-pending' : 'status-draft')))}" th:text="${a.status}">DRAFT</span>
                    </td>
                    <td th:text="${#temporals.format(a.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                    <td class="actions">
                        <a th:href="@{/expert/articles/{id}(id=${a.id})}">Xem</a>
                        <a th:href="@{/expert/articles/{id}/stats(id=${a.id})}">Thống kê</a>
                    </td>
                </tr>
                <tr th:if="${articles == null or articles.totalElements == 0}"><td colspan="4">Chưa có bài viết.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
