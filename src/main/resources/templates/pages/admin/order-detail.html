<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết đơn hàng</title>
    <style>
        .status-badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
        .status-paid{background:#dcfce7;color:#166534}.status-pending{background:#fef3c7;color:#92400e}.status-processing{background:#dbeafe;color:#1d4ed8}
        .seller-badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#ede9fe;color:#6d28d9}
        .meta-chip{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#f3f4f6;color:#374151}
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminLayout('Chi tiết đơn hàng', 'orders', ~{::main})}">
    <main>
        <section class="adm-card">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                <div>
                    <h1 style="font-size:22px;font-weight:800;margin:0;" th:text="${order != null ? order.orderCode : 'Đơn hàng'}">Đơn hàng</h1>
                    <p style="font-size:13px;color:var(--color-text-muted);margin-top:4px;">Thông tin chi tiết và trạng thái duyệt đơn.</p>
                </div>
                <form th:if="${order != null && order.paymentStatus == 'PAID' && order.orderStatus == 'PENDING'}" th:action="@{/admin/orders/{id}/approve(id=${order.id})}" method="post">
                    <button type="submit" class="btn btn-success">Duyệt đơn hàng</button>
                </form>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><div class="small text-muted">Payment</div><div class="fw-bold"><span class="status-badge" th:classappend="${order.paymentStatus == 'PAID' ? 'status-paid' : (order.paymentStatus == 'PENDING' ? 'status-pending' : '')}" th:text="${order.paymentStatus}">-</span></div></div></div>
                <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><div class="small text-muted">Order status</div><div class="fw-bold"><span class="status-badge" th:classappend="${order.orderStatus == 'PROCESSING' ? 'status-processing' : (order.orderStatus == 'PENDING' ? 'status-pending' : '')}" th:text="${order.orderStatus}">-</span></div></div></div>
                <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><div class="small text-muted">Tổng tiền</div><div class="fw-bold" th:text="${order.totalAmount}">0</div></div></div>
                <div class="col-md-3"><div class="p-3 border rounded-3 bg-light"><div class="small text-muted">Ngày đặt</div><div class="fw-bold" th:text="${order.orderedAt}">-</div></div></div>
            </div>

            <div class="mb-3">
                <span class="meta-chip" th:text="${'Số seller khác nhau: ' + (order.items != null ? #lists.size(order.items.![sellerId].distinct()) : 0)}">Số seller khác nhau: 0</span>
            </div>

            <h3 class="h5 fw-bold mb-3">Sản phẩm trong đơn</h3>
            <table class="table align-middle">
                <thead><tr><th>Seller</th><th>Sản phẩm</th><th>Biến thể</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td><span class="seller-badge" th:text="${item.sellerName != null ? item.sellerName : ('Seller #' + item.sellerId)}">Seller</span></td>
                    <td th:text="${item.productName != null ? item.productName : item.productVariantId}">Product</td>
                    <td th:text="${item.variantName != null ? item.variantName : item.productVariantId}">Variant</td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${item.unitPrice}">0</td>
                    <td th:text="${item.lineTotal}">0</td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</div>
</body>
</html>
