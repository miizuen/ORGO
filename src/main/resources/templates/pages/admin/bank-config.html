<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cấu hình ngân hàng trung gian</title>
    <style>
        .wrap{max-width:760px;margin:0 auto}
        .card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.04)}
        .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
        .field label{display:block;font-size:12px;font-weight:700;color:#6b7280;margin-bottom:6px}
        .field input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:12px}
        .actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
        .note{margin-top:12px;font-size:13px;color:#6b7280}
        .meta{margin-bottom:16px}
        @media (max-width: 640px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminLayout('Cấu hình ngân hàng trung gian', 'bank-config', ~{::main})}">
    <main class="wrap">
        <h1 style="font-size:24px;font-weight:900;margin-bottom:16px;">Cấu hình ngân hàng trung gian</h1>
        <div th:if="${successMessage}" class="card" style="border-color:#86efac;background:#f0fdf4;color:#166534;margin-bottom:16px;" th:text="${successMessage}"></div>
        <div class="card">
            <div class="meta" th:if="${bankConfig != null}">
                <div style="font-size:12px;color:#6b7280;">Trạng thái active</div>
                <div style="font-weight:800;" th:text="${bankConfig.status}">ACTIVE</div>
                <div style="font-size:12px;color:#6b7280;margin-top:6px;">Cập nhật gần nhất: <span th:text="${bankConfig.updatedAt}">-</span></div>
            </div>
            <form method="post" th:action="@{/admin/bank-config}">
                <div class="grid">
                    <div class="field"><label>Tên ngân hàng</label><input type="text" name="bankName" th:value="${bankConfig != null ? bankConfig.bankName : 'MB Bank'}"></div>
                    <div class="field"><label>Mã ngân hàng</label><input type="text" name="bankCode" th:value="${bankConfig != null ? bankConfig.bankCode : 'mb'}"></div>
                    <div class="field"><label>Số tài khoản</label><input type="text" name="accountNumber" th:value="${bankConfig != null ? bankConfig.accountNumber : ''}"></div>
                    <div class="field"><label>Chủ tài khoản</label><input type="text" name="accountHolderName" th:value="${bankConfig != null ? bankConfig.accountHolderName : ''}"></div>
                </div>
                <div class="actions">
                    <button class="btn btn-primary" type="submit">Lưu cấu hình</button>
                </div>
            </form>
            <div class="note">Dùng cấu hình này để sinh QR checkout theo đơn hàng và đối soát nội bộ trước khi triển khai payout thật.</div>
        </div>
    </main>
</div>
</body>
</html>
