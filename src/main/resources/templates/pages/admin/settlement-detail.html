<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chi tiết settlement</title>
    <style>
        .hero{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;border-radius:24px;padding:26px}
        .hero h1{margin:0;font-size:28px;font-weight:900}
        .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}
        .card{padding:18px;border:1px solid var(--color-border);border-radius:18px;background:#fff}
        .label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-text-faint)}
        .value{font-size:24px;font-weight:900;margin-top:10px}
        .panel{margin-top:18px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:24px;padding:20px}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{padding:12px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}
        th{font-size:11px;text-transform:uppercase;color:var(--color-text-faint)}
    </style>
</head>
<body>
<div th:replace="~{fragments/admin-layout :: adminLayout('Chi tiết doanh thu', 'revenue-reconciliation', ~{::main})}">
    <main>
        <section class="hero">
            <h1>Doanh thu đơn #<span th:text="${orderId}">0</span></h1>
            <p>Xem tổng quan chi tiết các bản ghi chia tiền cho từng seller trong đơn này.</p>
        </section>

        <div class="grid">
            <div class="card"><div class="label">Tổng settlement</div><div class="value" th:text="${settlements != null ? settlements.size() : 0}">0</div></div>
            <div class="card"><div class="label">Tổng seller nhận</div><div class="value" th:text="${totalSellerAmount != null ? #numbers.formatDecimal(totalSellerAmount, 0, 'POINT', 0, 'COMMA') + 'đ' : '0đ'}">0đ</div></div>
            <div class="card"><div class="label">Tổng hoa hồng</div><div class="value" th:text="${totalCommissionAmount != null ? #numbers.formatDecimal(totalCommissionAmount, 0, 'POINT', 0, 'COMMA') + 'đ' : '0đ'}">0đ</div></div>
            <div class="card"><div class="label">Trạng thái giao dịch</div><div class="value" th:text="${escrow != null ? escrow.status : 'N/A'}">N/A</div></div>
        </div>

        <div class="panel">
            <h2 style="font-size:18px;font-weight:800;margin:0;">Chi tiết settlement</h2>
            <table>
                <thead><tr><th>Seller</th><th>Tổng đơn</th><th>Hoa hồng</th><th>Seller nhận</th><th>Trạng thái</th></tr></thead>
                <tbody>
                <tr th:if="${settlements == null || settlements.isEmpty()}"><td colspan="5">Chưa có dữ liệu.</td></tr>
                <tr th:each="item : ${settlements}">
                    <td th:text="${item.sellerId}">1</td>
                    <td th:text="${item.orderAmount}">0</td>
                    <td th:text="${item.commissionAmount}">0</td>
                    <td th:text="${item.sellerAmount}">0</td>
                    <td th:text="${item.status}">SETTLED</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
