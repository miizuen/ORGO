<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
</head>
<body>
<th:block th:replace="~{fragments/admin-layout :: adminLayout(
    title='Quản lý người dùng',
    activePage=${activePage},
    content=~{::main}
)}">
<main>
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }
        
        .header-left h1 {
            font-size: 32px;
            color: #111827;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header-subtitle {
            font-size: 14px;
            color: #6b7280;
        }
        
        .header-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-secondary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary {
            background: #10b981;
            color: white;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }
        
        .stat-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        
        .stat-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .stat-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .badge-green {
            background: #d1fae5;
            color: #059669;
        }
        
        .badge-blue {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .badge-purple {
            background: #e0e7ff;
            color: #4338ca;
        }
        
        .badge-red {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .stat-label {
            font-size: 13px;
            color: #6b7280;
        }
        
        /* Users Table */
        .users-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        
        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab.active {
            background: #d1fae5;
            color: #059669;
        }
        
        .tab:hover {
            background: #f3f4f6;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }
        
        .table-info {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }
        
        .users-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .users-table th {
            text-align: left;
            padding: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e5e7eb;
        }
        
        .users-table td {
            padding: 16px 12px;
            font-size: 14px;
            color: #374151;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }
        
        .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .user-info h4 {
            font-size: 14px;
            font-weight: 500;
            color: #111827;
            margin-bottom: 2px;
        }
        
        .user-id {
            font-size: 12px;
            color: #9ca3af;
        }
        
        .role-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .role-expert {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .role-seller {
            background: #e0e7ff;
            color: #4338ca;
        }
        
        .role-user {
            background: #f3f4f6;
            color: #6b7280;
        }
        
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-active {
            background: #d1fae5;
            color: #059669;
        }
        
        .status-active::before {
            content: '●';
            font-size: 8px;
        }
        
        .status-blocked {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .status-blocked::before {
            content: '●';
            font-size: 8px;
        }
        
        .action-btn {
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            position: relative;
        }
        
        .action-btn:hover {
            color: #111827;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }
        
        .pagination-info {
            font-size: 13px;
            color: #6b7280;
        }
        
        .pagination-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        
        .page-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
        }
        
        .page-btn.active {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
        
        .page-btn:hover:not(.active):not(:disabled) {
            background: #f3f4f6;
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .items-per-page {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }
    </style>
    
    <div class="header">
        <div class="header-left">
            <h1>Quản lý người dùng</h1>
            <p class="header-subtitle">Quản lý và giám sát người dùng trên hệ thống</p>
        </div>
    </div>
    
    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon" style="background: #d1fae5;">👥</div>
                <span class="stat-badge badge-green">Total</span>
            </div>
            <div class="stat-value" id="total-count">0</div>
            <div class="stat-label">Tổng số người dùng</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon" style="background: #dbeafe;">✓</div>
                <span class="stat-badge badge-blue">Active</span>
            </div>
            <div class="stat-value" id="active-count">0</div>
            <div class="stat-label">Người dùng hoạt động</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon" style="background: #fee2e2;">🚫</div>
                <span class="stat-badge badge-red">Banned</span>
            </div>
            <div class="stat-value" id="banned-count">0</div>
            <div class="stat-label">Tài khoản bị cấm</div>
        </div>
        
        <div class="stat-card">
            <div class="stat-header">
                <div class="stat-icon" style="background: #e0e7ff;">📊</div>
                <span class="stat-badge badge-purple">Stats</span>
            </div>
            <div class="stat-value" id="today-count">-</div>
            <div class="stat-label">Thống kê</div>
        </div>
    </div>
    
    <!-- Users Table -->
    <div class="users-card">
        <div class="table-header">
            <div class="filter-tabs">
                <button class="tab active" data-status="">Tất cả</button>
                <button class="tab" data-status="ACTIVE">Hoạt động</button>
                <button class="tab" data-status="BANNED">Bị cấm</button>
            </div>
        </div>
        
        <div class="table-info">Đang tải...</div>
        
        <table class="users-table">
            <thead>
                <tr>
                    <th>TÊN NGƯỜI DÙNG</th>
                    <th>VAI TRÒ</th>
                    <th>EMAIL</th>
                    <th>SỐ ĐIỆN THOẠI</th>
                    <th>TRẠNG THÁI</th>
                    <th>THAO TÁC</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="6" style="text-align: center; padding: 40px;">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
        
        <!-- Pagination -->
        <div class="pagination">
            <div class="pagination-info">
                Hiển thị: 
                <select class="items-per-page">
                    <option value="10">10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div class="pagination-controls"></div>
        </div>
    </div>
    
    <script>
        let currentPage = 0;
        let currentSize = 10;
        let currentStatus = null;
        let totalPages = 0;
        let totalElements = 0;
        
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentStatus = this.dataset.status || null;
                    currentPage = 0;
                    loadUsers();
                });
            });
            
            document.querySelector('.items-per-page').addEventListener('change', function() {
                currentSize = parseInt(this.value);
                currentPage = 0;
                loadUsers();
            });
        }
        
        function loadUsers() {
            let url = `/api/admin/users?page=${currentPage}&size=${currentSize}`;
            if (currentStatus) {
                url += `&status=${currentStatus}`;
            }
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    totalPages = data.totalPages;
                    totalElements = data.totalElements;
                    renderUsers(data.content);
                    renderPagination(data);
                    updateStats();
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.querySelector('.users-table tbody').innerHTML = 
                        '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #dc2626;">Không thể tải dữ liệu</td></tr>';
                });
        }
        
        function renderUsers(users) {
            const tbody = document.querySelector('.users-table tbody');
            tbody.innerHTML = '';
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">Không có người dùng nào</td></tr>';
                return;
            }
            
            users.forEach(user => {
                const tr = document.createElement('tr');
                const avatarContent = getAvatarContent(user);
                
                tr.innerHTML = `
                    <td>
                        <div class="user-cell">
                            ${avatarContent}
                            <div class="user-info">
                                <h4>${user.fullName || 'N/A'}</h4>
                                <div class="user-id">ID: #${user.id}</div>
                            </div>
                        </div>
                    </td>
                    <td><span class="role-badge ${getRoleClass(user.role)}">${user.role}</span></td>
                    <td>${user.email || 'N/A'}</td>
                    <td>${user.phoneNumber || 'N/A'}</td>
                    <td><span class="status-badge ${getStatusClass(user.status)}">${getStatusText(user.status)}</span></td>
                    <td>
                        ${user.status === 'ACTIVE' ? 
                            `<button class="action-btn" onclick="banUser(${user.id})" title="Ban user">🚫</button>` :
                            `<button class="action-btn" onclick="unbanUser(${user.id})" title="Unban user">✓</button>`
                        }
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            const start = currentPage * currentSize + 1;
            const end = Math.min((currentPage + 1) * currentSize, totalElements);
            document.querySelector('.table-info').textContent = `Hiển thị ${start}-${end} trong tổng số ${totalElements} người dùng`;
        }
        
        function getAvatarContent(user) {
            // Nếu có avatarUrl thì hiển thị ảnh
            if (user.avatarUrl && user.avatarUrl.trim() !== '') {
                const initial = getLastNameInitial(user.fullName);
                const bgColor = getAvatarColor(initial);
                return `<div class="user-avatar" style="background: ${bgColor};">
                            <img src="${user.avatarUrl}" alt="${user.fullName || 'Avatar'}" onerror="this.style.display='none'; this.parentElement.textContent='${initial}';">
                        </div>`;
            }
            
            // Nếu không có ảnh thì hiển thị chữ cái cuối của tên với màu ngẫu nhiên
            const initial = getLastNameInitial(user.fullName);
            const bgColor = getAvatarColor(initial);
            return `<div class="user-avatar" style="background: ${bgColor};">${initial}</div>`;
        }
        
        function getLastNameInitial(fullName) {
            if (!fullName || fullName.trim() === '') {
                return 'U';
            }
            
            // Tách tên thành các từ và lấy từ cuối cùng
            const nameParts = fullName.trim().split(/\s+/);
            const lastName = nameParts[nameParts.length - 1];
            
            // Lấy chữ cái đầu của từ cuối cùng
            return lastName.charAt(0).toUpperCase();
        }
        
        function getAvatarColor(initial) {
            // Bảng màu đẹp mắt cho avatar
            const colors = [
                '#2e7d32', // Xanh lá đậm
                '#1976d2', // Xanh dương
                '#d32f2f', // Đỏ
                '#f57c00', // Cam
                '#7b1fa2', // Tím
                '#0097a7', // Xanh ngọc
                '#c2185b', // Hồng đậm
                '#5d4037', // Nâu
                '#455a64', // Xám xanh
                '#00897b', // Xanh lục
                '#e64a19', // Cam đậm
                '#1565c0', // Xanh dương đậm
                '#6a1b9a', // Tím đậm
                '#00695c', // Xanh lục đậm
                '#4527a0', // Tím than
                '#558b2f', // Xanh lá olive
                '#f9a825', // Vàng
                '#ad1457', // Hồng
                '#6d4c41', // Nâu đậm
                '#37474f'  // Xám đen
            ];
            
            // Sử dụng mã ASCII của chữ cái để chọn màu (cùng chữ cái = cùng màu)
            const charCode = initial.charCodeAt(0);
            const index = charCode % colors.length;
            
            return colors[index];
        }
        
        function renderPagination(data) {
            const controls = document.querySelector('.pagination-controls');
            controls.innerHTML = '';
            
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = 'Trước';
            prevBtn.disabled = data.first;
            prevBtn.onclick = () => {
                if (!data.first) {
                    currentPage--;
                    loadUsers();
                }
            };
            controls.appendChild(prevBtn);
            
            const startPage = Math.max(0, currentPage - 2);
            const endPage = Math.min(totalPages - 1, currentPage + 2);
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                pageBtn.textContent = i + 1;
                pageBtn.onclick = () => {
                    currentPage = i;
                    loadUsers();
                };
                controls.appendChild(pageBtn);
            }
            
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = 'Sau';
            nextBtn.disabled = data.last;
            nextBtn.onclick = () => {
                if (!data.last) {
                    currentPage++;
                    loadUsers();
                }
            };
            controls.appendChild(nextBtn);
        }
        
        function updateStats() {
            fetch('/api/admin/users?page=0&size=1')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('total-count').textContent = data.totalElements.toLocaleString();
                });
            
            fetch('/api/admin/users?status=ACTIVE&page=0&size=1')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('active-count').textContent = data.totalElements.toLocaleString();
                });
            
            fetch('/api/admin/users?status=BANNED&page=0&size=1')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('banned-count').textContent = data.totalElements.toLocaleString();
                });
        }
        
        function banUser(userId) {
            if (!confirm('Bạn có chắc chắn muốn cấm người dùng này?')) return;
            
            fetch(`/api/admin/users/${userId}/ban`, { method: 'PUT' })
                .then(response => {
                    if (response.ok) {
                        alert('Đã cấm người dùng thành công');
                        loadUsers();
                    } else {
                        alert('Không thể cấm người dùng');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Có lỗi xảy ra');
                });
        }
        
        function unbanUser(userId) {
            if (!confirm('Bạn có chắc chắn muốn bỏ cấm người dùng này?')) return;
            
            fetch(`/api/admin/users/${userId}/unban`, { method: 'PUT' })
                .then(response => {
                    if (response.ok) {
                        alert('Đã bỏ cấm người dùng thành công');
                        loadUsers();
                    } else {
                        alert('Không thể bỏ cấm người dùng');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Có lỗi xảy ra');
                });
        }
        
        function getRoleClass(role) {
            if (!role) return 'role-user';
            if (role.includes('EXPERT')) return 'role-expert';
            if (role.includes('SELLER')) return 'role-seller';
            return 'role-user';
        }
        
        function getStatusClass(status) {
            return status === 'ACTIVE' ? 'status-active' : 'status-blocked';
        }
        
        function getStatusText(status) {
            return status === 'ACTIVE' ? 'Hoạt động' : 'Bị cấm';
        }
    </script>
</main>
</th:block>
</body>
</html>
